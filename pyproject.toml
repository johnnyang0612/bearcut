[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bearcut"
version = "0.2.1"
description = "自動順剪：把毛片剪成可用的成片，並自己檢查剪得對不對。Automatic rough-cut that removes retakes, stumbles and dead air — and verifies its own cuts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "川輝科技有限公司 (Brightstream Technology Co., Ltd.)" },
]
keywords = [
    "video-editing", "auto-cut", "rough-cut", "whisper", "paraformer",
    "speech-recognition", "ffmpeg", "subtitles", "short-form-video",
    "ai-agent", "podcast", "silence-removal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Chinese (Traditional)",
    # 只列實際驗證過的平台。macOS / Linux 的程式碼路徑已寫好、相依套件也確認
    # 可安裝，但未在實機驗證，因此不在此宣告支援——等實測通過再加回來。
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

# 執行期相依刻意留空：核心相依（torch/funasr 等）體積龐大且需要依平台挑輪子，
# 由 bootstrap.py 統一處理，讓 `pip install bearcut` 保持輕量、能先裝起來看說明。
# 完整安裝：pip install "bearcut[full]" 或執行 python bootstrap.py
dependencies = []

[project.optional-dependencies]
full = [
    "faster-whisper>=1.2.0",
    "funasr>=1.3.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "modelscope==1.20.0",
    "addict",
    "editdistance>=0.6.0",
    "Pillow>=10.0.0",
    "jieba>=0.42.1",
    "zhconv>=1.4.3",
    "opencv-python==4.11.0.86",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/johnnyang0612/bearcut"
Repository = "https://github.com/johnnyang0612/bearcut"
Issues = "https://github.com/johnnyang0612/bearcut/issues"

[project.scripts]
bearcut = "bearcut.__main__:main"

[tool.setuptools]
packages = ["bearcut", "bearcut.env"]

[tool.setuptools.package-data]
bearcut = ["../assets/fonts/*.otf"]
